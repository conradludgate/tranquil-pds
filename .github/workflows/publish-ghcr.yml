name: Publish SQLite image

on:
  push:
    branches:
      - megamerge
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/conradludgate/tranquil-pds

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sqlite
            type=sha,prefix=sqlite-
            type=ref,event=tag

      - name: Build and publish SQLite image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The production Hetzner node is amd64. Building ARM64 on the
          # amd64 GitHub-hosted runner requires emulation and is prohibitively
          # slow for the Rust release build.
          platforms: linux/amd64
          build-args: |
            BACKEND=sqlite
            COMPRESS=false
            CARGO_BUILD_JOBS=4
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
